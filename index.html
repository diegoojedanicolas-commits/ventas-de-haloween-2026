<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween de última hora</title>
<style>
:root{--ink:#141414;--muted:#6f6f6f;--line:#e8e4df;--card:#faf8f6;--red:#c8102e;--or:#f26a1b;--tint:#fff1e6;color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:34px 22px 44px}
svg{display:block;width:100%;height:auto}
.eye{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
h1{border-top:4px solid var(--red);padding-top:20px;font:700 32px/1.12 Georgia,"Times New Roman",serif;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px;max-width:58ch}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}

/* hero */
.hero{background:#141414;color:#fff;border-radius:16px;overflow:hidden}
.hero .in{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding:26px 28px 18px}
.hero .eye{color:#ff7b8f}
.n82{font:400 88px/1 Georgia,serif;margin:8px 0 2px;display:flex;align-items:baseline;gap:4px}.n82 small{font-size:34px;color:#cfcfcf}
.hero p{margin:0;font-size:13px;color:#b5b5b5;max-width:30ch}
.pk{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:16px}
.pk svg{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.in-view .pk svg{opacity:1;transform:none}
.side{border-left:1px solid #2e2e2e;padding-left:28px;display:flex;flex-direction:column;justify-content:center}
.n600{font:400 54px/1 Georgia,serif;color:var(--or);margin:8px 0 4px}
.peak{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:#d6d6d6;border:1px solid #3a3a3a;border-radius:999px;padding:4px 12px;align-self:flex-start}
.peak i{width:8px;height:8px;border-radius:50%;background:var(--or)}
.road{background:#1d1d1d;border-top:1px solid #2e2e2e}
.mv{animation:mv 12s linear infinite}@keyframes mv{from{transform:translateX(-90px)}to{transform:translateX(720px)}}
.rd{stroke-dasharray:12 9;animation:rd 1s linear infinite}@keyframes rd{to{stroke-dashoffset:-21}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* sections */
.sec{margin-top:34px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh b{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sh span{flex:1;height:1px;background:var(--line)}
.sh em{font-style:normal;color:var(--red);font-weight:700;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ib{width:46px;height:46px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none}
.ib svg{width:28px}
.ln{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.ln:last-of-type{margin-bottom:0}
.ln .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.ln .t b{font:400 22px Georgia,serif}
.tr{display:block;height:8px;background:#ece8e3;border-radius:4px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:4px;background:var(--red);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.fill.g{background:#b9b3ab}
.tag{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;color:var(--red);background:#fdeaee;border-radius:999px;padding:3px 11px}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tops div{text-align:center;font-size:13px;font-weight:700}
.tops .ib{width:64px;height:64px;margin:0 auto 8px}.tops .ib svg{width:38px}
.pet{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.pet .big{font:400 56px/1 Georgia,serif;color:var(--or)}
.pet .big small{font-size:22px}
.pet p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.dg{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.dg svg{opacity:.18}.dg svg.on{opacity:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center}
.tile .ib{margin:0 auto 10px;width:54px;height:54px}.tile .ib svg{width:32px}
.tile .ib.two svg{width:22px}.tile .ib.two{gap:0}
.tile b{display:block;font:400 28px/1 Georgia,serif;color:var(--red)}
.tile small{display:block;font-size:12px;color:var(--muted);margin:4px 0 10px}
.src{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:620px){.hero .in{grid-template-columns:1fr;gap:18px}.side{border-left:0;border-top:1px solid #2e2e2e;padding:18px 0 0}.n82{font-size:72px}.grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.pet{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mv,.rd,.wh{animation:none!important}.fill,.pk svg{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eye" style="display:none"></div>
  <h1>Halloween de última hora</h1>
  <p class="sub">El 82 % de las ventas de disfraces en Rappi se concentró en la última semana de octubre.</p>
  <div id="app"></div>
  <div class="src">Fuente: Rappi.</div>
</div>
<script>
(function(){
var fm=n=>Math.round(n).toLocaleString("es-CO"),uid=0;
var sv=(b,x)=>'<svg viewBox="0 0 48 48" aria-hidden="true" '+(x||"")+">"+b+"</svg>";
var I={
 paint:'<circle cx="24" cy="24" r="19" fill="#fff" stroke="#141414" stroke-width="2.6"/><path d="M10 19l8 2M38 19l-8 2M12 28l8 1M36 28l-8 1" stroke="#c8102e" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="20" r="2" fill="#141414"/><circle cx="31" cy="20" r="2" fill="#141414"/><path d="M18 33q6 5 12 0" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/>',
 blood:'<path d="M24 4C16 16 10 22 10 31a14 14 0 0 0 28 0C38 22 32 16 24 4z" fill="#c8102e"/><path d="M17 31a7 7 0 0 0 6 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".6"/>',
 hat:'<path d="M24 4l11 28H13z" fill="#141414"/><ellipse cx="24" cy="34" rx="20" ry="5" fill="#141414"/><rect x="14" y="26" width="20" height="4" fill="#f26a1b"/>',
 burger:'<path d="M6 22Q6 8 24 8t18 14z" fill="#e0a040"/><rect x="5" y="24" width="38" height="4" rx="2" fill="#2d6a2d"/><rect x="5" y="29" width="38" height="6" rx="3" fill="#6b3a1e"/><path d="M6 37h36q0 6-8 6H14q-8 0-8-6z" fill="#e0a040"/>',
 chicken:'<path d="M30 6c8 0 12 8 8 15s-12 8-18 8l-8 8-5-5 8-8c0-6 3-18 15-18z" fill="#d98a3a"/><path d="M8 37l-3 3a3 3 0 1 0 4 4l3-3z" fill="#f2e6c9"/>',
 bottle:'<path d="M20 4h8v10l5 8v22H15V22l5-8z" fill="#2d6a2d"/><rect x="20" y="4" width="8" height="5" fill="#141414"/><rect x="15" y="28" width="18" height="10" fill="#fff" opacity=".85"/>',
 shirt:'<path d="M16 6l-12 8 5 8 5-3v22h20V19l5 3 5-8-12-8q-3 5-8 5t-8-5z" fill="#141414"/><path d="M16 6q3 5 8 5t8-5" fill="none" stroke="#f26a1b" stroke-width="2"/>',
 pencil:'<path d="M34 5l9 9L17 40l-11 3 3-11z" fill="#f2b630"/><path d="M34 5l9 9-4 4-9-9z" fill="#c8102e"/><path d="M9 32l7 7-10 4z" fill="#f4d9b5"/><path d="M6 43l3-1-2-2z" fill="#141414"/>'
};
function pumpkin(p,d){var id="c"+(++uid),stem=function(c){return '<path d="M24 14V6" stroke="'+c+'" stroke-width="4" stroke-linecap="round"/>'};
 return sv('<clipPath id="'+id+'"><rect width="'+(48*p)+'" height="48"/></clipPath><ellipse cx="24" cy="29" rx="20" ry="16" fill="#333"/>'+stem("#3d3d3d")+'<g clip-path="url(#'+id+')"><ellipse cx="24" cy="29" rx="20" ry="16" fill="#f26a1b"/>'+stem("#4c9a4c")+'<path d="M15 25l4 5h-8zM33 25l4 5h-8z" fill="#141414"/><path d="M14 36Q24 43 34 36l-3-2-3 3-4-3-4 3-3-3z" fill="#141414"/></g>','style="transition-delay:'+d+'s"')}
function dog(on){return sv('<path d="M10 22c-6 2-6 12 0 14l5-6zM38 22c6 2 6 12 0 14l-5-6z" fill="#8a5a2b"/><ellipse cx="24" cy="29" rx="12" ry="12" fill="#d9a066"/><circle cx="19" cy="27" r="1.8" fill="#141414"/><circle cx="29" cy="27" r="1.8" fill="#141414"/><ellipse cx="24" cy="32" rx="3.2" ry="2.4" fill="#141414"/>'+(on?'<path d="M24 3l7 15H17z" fill="#f26a1b"/><circle cx="24" cy="3" r="2.4" fill="#c8102e"/>':""),on?'class="on"':"")}
var ib=(k,c)=>'<span class="ib'+(c||"")+'">'+k.split("+").map(x=>sv(I[x])).join("")+"</span>";
var line=(k,l,v,w,c)=>'<div class="ln">'+ib(k)+'<div><div class="t"><span>'+l+'</span><b>'+v+'</b></div><span class="tr"><span class="fill '+(c||"")+'" data-w="'+w+'"></span></span></div></div>';

var pk="";for(var i=0;i<10;i++)pk+=pumpkin(i<8?1:(i===8?.2:0),i*.07);
var dg="";for(i=0;i<16;i++)dg+=dog(i===5);

var O=[["shirt+pencil","Moda y papelería","hasta +120 %",100,"two"],["burger","Hamburguesas","+24 %",20],["chicken","Pollo","+20 %",16.7],["bottle","Licores","+20 %",16.7]];

document.getElementById("app").innerHTML=
'<section class="hero" data-r>'+
 '<div class="in"><div><div class="eye">Ventas de disfraces</div><div class="n82"><span class="cu" data-n="82">0</span><small>%</small></div><p>en la última semana de octubre</p><div class="pk">'+pk+'</div></div>'+
 '<div class="side"><div class="eye">Rappi Turbo</div><div class="n600">+<span class="cu" data-n="600">0</span> %</div><p>órdenes de accesorios para disfraces, la semana previa a Halloween</p><span class="peak"><i></i>Pico de ventas: 31 de octubre</span></div></div>'+
 '<div class="road"><svg viewBox="0 0 640 56" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un repartidor en moto cruza la calle"><line class="rd" x1="0" x2="640" y1="48" y2="48" stroke="#555" stroke-width="2"/><g class="mv"><g transform="translate(0 6)"><rect x="-4" y="6" width="22" height="20" rx="2" fill="#f26a1b"/><rect x="-4" y="6" width="22" height="5" rx="2" fill="#c8102e"/><path d="M20 30h20l8-12h6M26 30l6-14h8" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="34" cy="8" r="5" fill="#fff"/><path d="M30 12l-4 8h12l2-8z" fill="#fff"/><circle class="wh" cx="22" cy="36" r="7" fill="#1d1d1d" stroke="#fff" stroke-width="3"/><circle class="wh" cx="52" cy="36" r="7" fill="#1d1d1d" stroke="#fff" stroke-width="3"/></g></g></svg></div>'+
'</section>'+

'<section class="sec" data-r><div class="sh"><em>01</em><b>Disfraces</b><span></span></div>'+
 '<div class="grid"><div class="card"><h3>Órdenes promedio en octubre</h3>'+line("paint","Accesorios","6.700",100)+line("hat","Trajes completos","1.700",25.4,"g")+'<span class="tag">Casi 4 veces más accesorios</span></div>'+
 '<div class="card"><h3>Los más vendidos</h3><div class="tops"><div>'+ib("paint")+'Pintucaritas</div><div>'+ib("blood")+'Sangre artificial</div></div></div></div>'+
 '<div class="card" style="margin-top:14px"><h3>Disfraces para mascotas</h3><div class="pet"><div><div class="big"><span class="cu" data-n="6">0</span><small> %</small></div><p>del volumen total de disfraces en Rappi Turbo: cerca de 100 órdenes, con pico el 30 de octubre.</p></div><div class="dg">'+dg+'</div></div></div></section>'+

'<section class="sec" data-r><div class="sh"><em>02</em><b>Qué más se pidió</b><span></span></div><div class="tiles">'+
 O.map(o=>'<div class="tile">'+ib(o[0],o[4]?" two":"")+'<b>'+o[2]+'</b><small>'+o[1]+'</small><span class="tr"><span class="fill" data-w="'+o[3]+'"></span></span></div>').join("")+
 '</div></section>';

function count(el){
  var n=+el.dataset.n,t0=null;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fm(n);return}
  (function s(t){if(t0===null)t0=t;var k=Math.min(1,(t-t0)/1300);el.textContent=fm(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(performance.now());
}
function show(s){
  s.classList.add("in-view");
  s.querySelectorAll(".cu").forEach(count);
  s.querySelectorAll(".fill[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
}
var secs=document.querySelectorAll("[data-r]");
if("IntersectionObserver" in window){
  var io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){show(e.target);io.unobserve(e.target)}}),{threshold:.25});
  secs.forEach(s=>io.observe(s));
}else secs.forEach(show);
})();
</script>
</body>
</html>
